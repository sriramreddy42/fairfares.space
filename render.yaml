services:
  - type: web
    name: fairfares
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "HOST=0.0.0.0 python3 app.py"
    disk:
      name: fairfares-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FAIRFARES_DB_PATH
        value: /var/data/fairfares.sqlite3
      - key: FAIRFARES_BACKUP_DIR
        value: /var/data/backups
      - key: FAIRFARES_BACKUP_KEEP
        value: "20"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "FairFares <hello@fairfare.space>"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
