services:
  - type: web
    name: fairfares
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "HOST=0.0.0.0 python3 app.py"
    healthCheckPath: /api/health
    disk:
      name: fairfares-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FAIRFARES_DB_PATH
        value: /var/data/fairfares.sqlite3
      - key: FAIRFARES_BACKUP_DIR
        value: /var/data/backups
      - key: FAIRFARES_BACKUP_KEEP
        value: "5"
      # Render terminates public traffic at its managed proxy. Enable forwarded
      # client IPs so abuse limits do not collapse every customer into the
      # proxy's private address. Never enable this on a directly exposed server.
      - key: FAIRFARES_TRUST_PROXY
        value: "1"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "FairFares <hello@fairfare.space>"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      # Google ID tokens created by the native apps use the server/Web OAuth
      # client as their audience. Keep every FairFares client in the backend
      # allow-list so Web, Android, and iOS tokens are accepted while tokens
      # issued to unrelated applications remain rejected.
      - key: GOOGLE_OAUTH_CLIENT_IDS
        value: "41774403974-u83lgq8j6edpthtrjnn5f2de5o2vaovo.apps.googleusercontent.com,41774403974-cl5760k73380elrfjpl53l0ar00og3tg.apps.googleusercontent.com,41774403974-asj11531ip4gakvt75ijvr8n58ies1kj.apps.googleusercontent.com"
      # The public website still uses its original Web client. Declare it in
      # the Blueprint instead of relying on an untracked manual Render value.
      - key: GOOGLE_WEB_CLIENT_ID
        value: "41774403974-gv0gpcao504prpo5urcldo6h9ioka0k1.apps.googleusercontent.com"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_AGENT_MCP_SERVERS
        sync: false
      - key: OPENAI_AGENT_MCP_ALLOW_UNRESTRICTED
        value: "0"
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET
        value: fairfares-attachments
      - key: CLOUDFLARE_R2_PREFIX
        value: fairfares
      - key: FAIRFARES_CHITTHI_MULTIPART_ENABLED
        value: "1"
      - key: FAIRFARES_CHITTHI_MAX_VIDEO_MB
        value: "100"
      - key: FAIRFARES_CHITTHI_ROLLOUT_PERCENT
        value: "100"
      - key: FAIRFARES_CHITTHI_ROLLOUT_USER_IDS
        value: ""
      - key: FAIRFARES_CHITTHI_CRYPTO_THROTTLE_MS
        value: "0"
