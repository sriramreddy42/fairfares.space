<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users | FairFares Admin</title>
  <link rel="stylesheet" href="/static/css/styles.css?v=admin-6">
  <script defer src="/static/js/app.js?v=32"></script>
</head>
<body class="admin-screen">
  <header class="admin-shell-header">
    <a class="logo-lockup" href="/admin"><img src="/static/img/logo-dark-header.png" alt="FairFares logo"></a>
    <nav>
      <a href="/admin">Inventory</a>
      <a href="/admin/bookings">Booked Cars</a>
      <a href="/admin/users">Users</a>
      <a href="/admin/discounts">Discounts</a>
      <a href="/admin/commercials">Commercials</a>
      <a href="/admin/pickup">User Pickup</a>
      <a href="/logout">Log out</a>
    </nav>
  </header>
  <main class="admin-layout">
    <section class="admin-hero">
      <div>
        <p class="eyebrow">Developer Portal</p>
        <h1>Users</h1>
        <span>Search by name, phone, email, booking, student ID, or FairFares user ID · $admin_name</span>
      </div>
    </section>
    <section class="admin-card">
      <label class="admin-search">
        <span>Search users</span>
        <input id="adminUserSearch" placeholder="First name, last name, phone number, email, booking ID, or user ID">
      </label>
    </section>
    <section class="admin-users-list">$users</section>
  </main>
</body>
</html>
