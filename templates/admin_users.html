<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users | FairFares Admin</title>
  $stylesheet_links
  <script defer src="/static/js/app.js?v=54"></script>
</head>
<body class="admin-screen">
  <header class="admin-shell-header">
    <a class="logo-lockup" href="/admin"><img src="/static/img/fairfares-logo-20260708.webp" alt="FairFares logo"></a>
    $admin_nav
  </header>
  <main class="admin-layout">
    <section class="admin-hero">
      <div>
        <p class="eyebrow">Developer Portal</p>
        <h1>Users</h1>
        <span>Search by name, phone, email, booking, student ID, or FairFares user ID Â· $admin_name</span>
      </div>
    </section>
    <section class="admin-card">
      $moderation_notice
      <form class="admin-search" method="get" action="/admin/users">
        <label>
          <span>Search users</span>
          <input id="adminUserSearch" name="q" value="$user_search_value" placeholder="Email, name, phone, user ID, post ID, ride, city, or content">
        </label>
        <button type="submit">Search</button>
      </form>
      $user_result_note
    </section>
    <section class="admin-users-list">$users</section>
  </main>
</body>
</html>
