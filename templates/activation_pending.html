<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activate Account | FairFares</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="login-screen">
  <header class="login-top">
    <a class="login-logo" href="/"><img src="/static/img/logo-light-header.png" alt="FairFares logo"></a>
    <div class="login-benefits">
      <span><b>Hybrid</b> Sedans & SUVs</span>
      <span><b>Fuel-Efficient</b> Rentals</span>
      <span><b>Electric</b> Vehicle Options</span>
    </div>
  </header>
  <main class="login-main activation-main">
    <section class="login-poster"></section>
    <section class="auth-card activation-card">
      <h2>Activate your account</h2>
      <p>$message</p>
      <div class="activation-panel">
        <strong>$email</strong>
        <span>Email delivery: $delivery_status</span>
        <span>Local email copy: $outbox_file</span>
      </div>
      <small class="secure-note">Open the email from FairFares and click the activation link to continue.</small>
    </section>
  </main>
</body>
</html>
