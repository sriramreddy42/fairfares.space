<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title | FairFares</title>
  $stylesheet_links
  <script defer src="/static/js/app.js?v=54"></script>
</head>
<body class="login-screen">
  <header class="login-top">
    <a class="login-logo" href="/"><img src="/static/img/fairfares-glow-logo.png" alt="FairFares logo"></a>
    <div class="login-benefits">
      <span><b>Hybrid</b> Sedans & SUVs</span>
      <span><b>Fuel-Efficient</b> Rentals</span>
      <span><b>Electric</b> Vehicle Options</span>
    </div>
  </header>
  <main class="login-main activation-main">
    <section class="login-poster"></section>
    <section class="auth-card activation-card">
      <h2>$title</h2>
      <p>$message</p>
      <a class="activation-link" href="$action_url">$action_label</a>
    </section>
  </main>
  $internal_links
</body>
</html>
