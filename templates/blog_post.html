<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <meta name="description" content="$description">
  <link rel="canonical" href="$canonical_url">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$canonical_url">
  <meta name="twitter:title" content="$title">
  <meta name="twitter:description" content="$description">
  $stylesheet_links
  <script defer src="/static/js/app.js?v=54"></script>
</head>
<body>
  <header class="top-brand compact-top">
    <a class="logo-lockup" href="/"><img src="/static/img/fairfares-glow-logo.png" alt="FairFares logo"></a>
    <div class="top-benefits">
      <div class="benefit-pill"><span class="circle-icon">car</span><strong>Rental guides</strong><span>Denver & Colorado</span></div>
      <div class="benefit-pill"><span class="circle-icon">fuel</span><strong>Pickup tips</strong><span>Airport & local</span></div>
      <div class="benefit-pill"><span class="circle-icon">bolt</span><strong>Price match</strong><span>Save after review</span></div>
    </div>
  </header>

  <nav class="main-nav">
    <div class="nav-links">
      <a href="/">Book</a>
      <a href="/blog" class="active">Blog</a>
      <a href="/deals">Deals</a>
      <a href="/explorer">Explorer</a>
    </div>
    <div class="nav-actions">
      <span>EN</span>
      $auth_link
      <button class="menu-button" type="button" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <main class="blog-post-page">
    <article class="blog-post">
      <header>
        <p class="eyebrow">$category · $date</p>
        <h1>$title</h1>
        <p>$intro</p>
      </header>

      <figure>
        <img src="/static/img/hero-road.png?v=$asset_version" alt="$hero">
        <figcaption>$hero</figcaption>
      </figure>

      <div class="blog-post-body">
        $sections
      </div>

      <div class="blog-post-cta">
        <a class="select-button" href="$cta_url">$cta_label</a>
        <a class="light-button" href="/blog">Back to blog</a>
      </div>
    </article>

    <aside class="blog-related">
      <h2>Related FairFares guides</h2>
      <div>$related_posts</div>
    </aside>
  </main>
</body>
</html>
