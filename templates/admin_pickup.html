<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Pickup Info | FairFares Admin</title>
  $stylesheet_links
  <script defer src="/static/js/app.js?v=54"></script>
</head>
<body class="admin-screen pickup-workspace-screen">
  <header class="admin-shell-header">
    <a class="logo-lockup" href="/admin"><img src="/static/img/fairfares-logo-20260708.webp" alt="FairFares logo"></a>
    $admin_nav
  </header>
  <main class="admin-layout">
    <section class="admin-hero">
      <div>
        <p class="eyebrow">Developer Portal</p>
        <h1>User Pickup Info</h1>
        <span>One guided workspace for identity, payment, inspection, agreement, and return review · $admin_name</span>
      </div>
    </section>
    <section class="admin-card pickup-search-card">
      <label class="admin-search">
        <span>Find a pickup or return file</span>
        <input id="pickupSearch" placeholder="Start typing user name, email, booking ID, or vehicle">
      </label>
    </section>
    <section class="pickup-records">$records</section>
  </main>
</body>
</html>
