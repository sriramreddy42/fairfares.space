<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password | FairFares</title>
  <link rel="stylesheet" href="/static/css/styles.css?v=site-57">
  <script defer src="/static/js/app.js?v=50"></script>
</head>
<body class="login-screen">
  <header class="login-top">
    <a class="login-logo" href="/"><img src="/static/img/fairfares-glow-logo.png" alt="FairFares logo"></a>
    <div class="login-benefits">
      <span><b>Hybrid</b> Sedans & SUVs</span>
      <span><b>Fuel-Efficient</b> Rentals</span>
      <span><b>Electric</b> Vehicle Options</span>
    </div>
  </header>
  <main class="login-main">
    <section class="login-poster" aria-label="FairFares student rental poster"></section>
    <section class="auth-card">
      <h2>Reset your password</h2>
      <p>Enter your email address and we'll send you a link to reset your password.</p>
      <p class="form-error">$error</p>
      <form method="post" action="/forgot-password">
        <label>
          <span>Email Address</span>
          <input name="email" type="email" autocomplete="email" placeholder="Enter your email" required>
        </label>
        <button type="submit">Send Reset Link</button>
      </form>
      <div class="signup-box">
        <span>Remember your password?</span>
        <a href="/login">Sign in</a>
      </div>
      <small class="secure-note">Your information is secure with us.</small>
    </section>
  </main>
  <footer class="login-footer">
    <span>No Hidden Fees</span>
    <span>Free Cancellation</span>
    <span>Exclusive Offers</span>
  </footer>
</body>
</html>
